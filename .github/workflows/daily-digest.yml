name: Daily Fantasy Baseball Digest

on:
  schedule:
    # Once daily, firing at 6 AM EDT (10:00 UTC). 
    - cron: '0 10 * * *'
  workflow_dispatch:       # allows manual trigger from the GitHub Actions UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest (with dashboard attached)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        # One fetch, one email: the digest builds the dashboard and attaches it too,
        # so both deliverables arrive together. (The standalone daily-dashboard.yml
        # schedule is retired -- it now only runs on manual dispatch.)
        run: python send_digest.py --with-dashboard

      - name: Data-coverage report (non-blocking)
        if: always()
        # Prints the semantic coverage/degradation report for the snapshot the digest
        # just refreshed, so a silently-degraded source (e.g. a Statcast merge dropping
        # from 92% -> 60%) is visible in the Actions log. Non-blocking: no --strict, and
        # `|| true` so it can never fail the digest job.
        run: python data_coverage.py || true
